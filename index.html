<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Service Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-navy">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">Local Service Finder</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" href="{{ url_for('home') }}">Home</a>
          <a class="nav-link" href="{{ url_for('providers') }}">Providers</a>
          <a class="nav-link" href="{{ url_for('add_provider') }}">Add Provider</a>
        </div>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container py-5">
      <h1 class="display-5 fw-bold">Local Service Finder</h1>
      <p class="lead mb-4">Find a service near you</p>
      <form class="row g-2 search-box" action="{{ url_for('providers') }}" method="get">
        <div class="col-md-5">
          <input class="form-control form-control-lg" type="text" name="service" placeholder="Search Service" required>
        </div>
        <div class="col-md-4">
          <input class="form-control form-control-lg" type="text" name="location" placeholder="Location">
        </div>
        <div class="col-md-3">
          <button class="btn btn-accent btn-lg w-100" type="submit">Find Services</button>
        </div>
      </form>
      <p class="mt-4 mb-2 text-muted-soft">Popular:</p>
      <div class="d-flex flex-wrap gap-2">
        <a class="badge-link" href="{{ url_for('providers', service='Electrician') }}">Electrician</a>
        <a class="badge-link" href="{{ url_for('providers', service='Mechanic') }}">Mechanic</a>
        <a class="badge-link" href="{{ url_for('providers', service='Plumber') }}">Plumber</a>
        <a class="badge-link" href="{{ url_for('providers', service='Laptop Repair') }}">Laptop Repair</a>
        <a class="badge-link" href="{{ url_for('providers', service='AC Repair') }}">AC Repair</a>
      </div>
    </div>
  </header>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
