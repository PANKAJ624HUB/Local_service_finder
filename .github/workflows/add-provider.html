<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Provider | Local Service Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-navy">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">Local Service Finder</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{{ url_for('home') }}">Home</a>
          <a class="nav-link" href="{{ url_for('providers') }}">Providers</a>
          <a class="nav-link active" href="{{ url_for('add_provider') }}">Add Provider</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">Add Provider</h1>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form class="row g-3" method="post" id="add-form">
      <div class="col-md-6">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" name="name" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="profession">Profession</label>
        <input class="form-control" id="profession" name="profession" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="phone">Phone</label>
        <input class="form-control" id="phone" name="phone" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="address">Address</label>
        <input class="form-control" id="address" name="address" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="price">Price</label>
        <input class="form-control" id="price" name="price" type="number" min="0" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="experience">Experience (years)</label>
        <input class="form-control" id="experience" name="experience" type="number" min="0" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="latitude">Latitude</label>
        <input class="form-control" id="latitude" name="latitude" type="number" step="any" value="{{ default_lat }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="longitude">Longitude</label>
        <input class="form-control" id="longitude" name="longitude" type="number" step="any" value="{{ default_lng }}" required>
      </div>
      <div class="col-12">
        <button class="btn btn-accent" type="submit">Add Provider</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
